<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AbsenKita - Tidak ada koneksi</title>
  <script src="config.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; background: #f8fafc; color: #0f172a;
           padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); box-sizing: border-box; }
    @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #e2e8f0; } p { color: #94a3b8 !important; } }
    main { max-width: 360px; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: #475569; line-height: 1.5; margin: 0 0 24px; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 14px; padding: 14px 28px;
             background: #2563eb; color: #fff; width: 100%; }
    button:active { opacity: .8; }
  </style>
</head>
<body>
  <main>
    <h1>Tidak dapat terhubung</h1>
    <p>AbsenKita membutuhkan koneksi internet. Periksa data seluler atau Wi-Fi Anda, lalu coba lagi.</p>
    <button type="button" id="coba">Coba lagi</button>
  </main>
  <script>
    function coba() { if (window.ABSENKITA_URL) location.replace(window.ABSENKITA_URL); else history.back(); }
    document.getElementById('coba').addEventListener('click', coba);
    // Kembali otomatis begitu koneksi pulih.
    window.addEventListener('online', coba);
  </script>
</body>
</html>
