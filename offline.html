<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>Tidak Ada Koneksi - AbsenKita Javag</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f8fafc; color: #0f172a; text-align: center; padding: 24px; box-sizing: border-box;
        }
        @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #e2e8f0; } p { color: #94a3b8; } }
        main { max-width: 360px; }
        img { width: 88px; height: 88px; margin-bottom: 16px; }
        h1 { font-size: 1.25rem; margin: 0 0 8px; }
        p { margin: 0 0 24px; color: #475569; line-height: 1.5; }
        button {
            font: inherit; font-weight: 600; padding: 12px 24px; border: 0; border-radius: 12px;
            background: #2563eb; color: #fff; cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="assets/images/icons/icon-192.png" alt="">
        <h1>Tidak ada koneksi internet</h1>
        <p>Absensi, slip gaji, dan pengajuan membutuhkan internet. Periksa koneksi Anda lalu coba lagi.</p>
        <button type="button" onclick="location.reload()">Coba Lagi</button>
    </main>
</body>
</html>
